[package]
name = "braincrawl-server"
edition.workspace = true
version.workspace = true

[lib]
name = "braincrawl_server_lib"
path = "src/lib.rs"

[[bin]]
name = "braincrawl-server"
path = "src/main.rs"

[dependencies]
braincrawl-core = { workspace = true }
braincrawl-blob-fs = { path = "../../crates/backends/blob-fs" }
braincrawl-store-sqlite = { path = "../../crates/backends/store-sqlite" }
braincrawl-coord-local = { path = "../../crates/backends/coord-local" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }
