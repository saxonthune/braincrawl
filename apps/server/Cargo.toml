[package]
name = "braincrawl-server-lib"
edition.workspace = true
version.workspace = true

[lib]
name = "braincrawl_server_lib"
path = "src/lib.rs"

[dependencies]
braincrawl-core = { workspace = true }
braincrawl-auth = { workspace = true }
braincrawl-blob-fs = { path = "../../crates/backends/blob-fs" }
braincrawl-store-sqlite = { path = "../../crates/backends/store-sqlite" }
braincrawl-coord-local = { path = "../../crates/backends/coord-local" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }
