[package]
name = "braincrawl-server-lib"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "braincrawl_server_lib"
path = "src/lib.rs"

[dependencies]
braincrawl-core = { workspace = true }
braincrawl-sql = { workspace = true }
braincrawl-auth = { workspace = true }
braincrawl-blob-fs = { path = "../../crates/backends/blob-fs" }
braincrawl-store-sqlite = { path = "../../crates/backends/store-sqlite" }
braincrawl-coord-local = { path = "../../crates/backends/coord-local" }
l3 = { path = "../../crates/l3" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt", "net", "macros", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
notify = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
braincrawl-conformance = { path = "../../crates/conformance" }
