[package]
name = "braincrawl-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "braincrawl-server"
path = "src/main.rs"

[dependencies]
braincrawl-server-lib = { path = "../server", package = "braincrawl-server-lib" }
braincrawl-core = { workspace = true }
braincrawl-auth = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }
braincrawl-conformance = { path = "../../crates/conformance" }
