[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/sql",
  "crates/backends/blob-r2",
  "crates/backends/blob-fs",
  "crates/backends/blob-mem",
  "crates/backends/store-d1",
  "crates/backends/store-sqlite",
  "crates/backends/store-mem",
  "crates/backends/resolver-kv",
  "apps/worker",
  "apps/server",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
braincrawl-core = { path = "crates/core", package = "braincrawl-core" }
async-trait = "0.1"
thiserror = "2"
